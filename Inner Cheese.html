<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF9E8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Inner Cheese · 哲思角落</title>
<style>
  :root{
    --cream:#FFF9E8;
    --cheese:#FFC72C;
    --cheese-deep:#F5A623;
    --brown:#5B4636;
    --brown-soft:#8A7361;
    --line:#F0E4C8;
    --safe-b:env(safe-area-inset-bottom, 0px);
    --safe-t:env(safe-area-inset-top, 0px);
  }

  *{ box-sizing:border-box; }

  html{ -webkit-text-size-adjust:100%; }

  body{
    margin:0;
    min-height:100vh;
    min-height:100dvh;
    font-family:-apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
                "Microsoft YaHei", "Segoe UI", sans-serif;
    color:var(--brown);
    background:var(--cream);
    background-image:
      radial-gradient(circle at 10% 15%, rgba(255,199,44,.14) 0 12px, transparent 13px),
      radial-gradient(circle at 85% 10%, rgba(255,199,44,.12) 0 18px, transparent 19px),
      radial-gradient(circle at 30% 70%, rgba(255,199,44,.09) 0 24px, transparent 25px),
      radial-gradient(circle at 90% 80%, rgba(255,199,44,.12) 0 10px, transparent 11px);
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    -webkit-tap-highlight-color:transparent;
  }

  body.locked{ overflow:hidden; }

  button, textarea, input{
    font-family:inherit;
    touch-action:manipulation;
  }

  .app-wrap{
    max-width:720px;
    margin:0 auto;
    padding:0 16px 88px;
    transition:filter .3s ease;
  }

  body.locked .app-wrap{
    filter:blur(14px);
    pointer-events:none;
    user-select:none;
  }

  /* ---------- 顶部 ---------- */
  .hero{
    text-align:center;
    padding:44px 8px 22px;
    position:relative;
  }

  .hero h1{
    margin:0 0 10px;
    font-size:clamp(26px, 7vw, 42px);
    font-weight:800;
    letter-spacing:.5px;
    background:linear-gradient(120deg,#E08B00,#F5B301 45%,#FFD447 70%,#E08B00);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .tagline{
    margin:0;
    color:var(--brown-soft);
    font-size:14px;
    line-height:1.7;
  }

  .hero .float{
    position:absolute;
    font-size:22px;
    opacity:.65;
    animation:floaty 5s ease-in-out infinite;
    pointer-events:none;
  }
  .f1{ left:6%; top:30px; }
  .f2{ right:8%; top:60px; animation-delay:1.5s; }

  @keyframes floaty{
    0%,100%{ transform:translateY(0) rotate(-4deg); }
    50%    { transform:translateY(-8px) rotate(5deg); }
  }

  /* ---------- 视图容器 ---------- */
  .view{ display:none; }
  .view.active{ display:block; animation:fadeUp .35s ease; }

  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(10px); }
    to  { opacity:1; transform:none; }
  }

  /* ---------- 通用卡片 ---------- */
  .card{
    background:#fff;
    border:2px solid rgba(245,180,30,.3);
    border-radius:24px;
    padding:22px 20px;
    box-shadow:0 10px 28px rgba(200,150,50,.1), inset 0 2px 0 rgba(255,255,255,.9);
    margin-bottom:18px;
  }

  .card-title{
    margin:0 0 14px;
    font-size:16px;
    font-weight:700;
    display:flex;
    align-items:center;
    gap:8px;
  }

  .card-title .emoji{ font-size:18px; }

  textarea{
    width:100%;
    min-height:100px;
    resize:vertical;
    border:2px solid var(--line);
    border-radius:16px;
    background:#FFFDF5;
    padding:13px 15px;
    font-size:16px;
    line-height:1.7;
    color:var(--brown);
    outline:none;
    transition:border-color .2s, box-shadow .2s, background .2s;
  }

  textarea::placeholder{ color:#C0AF94; }

  textarea:focus{
    border-color:var(--cheese);
    background:#fff;
    box-shadow:0 0 0 4px rgba(255,199,44,.16);
  }

  .btn{
    border:none;
    border-radius:14px;
    padding:14px 22px;
    font-size:15px;
    font-weight:700;
    color:#5B4636;
    background:linear-gradient(135deg,#FFD447,#F5A623);
    cursor:pointer;
    box-shadow:0 4px 0 #D98E00, 0 8px 18px rgba(245,166,35,.28);
    transition:transform .12s ease, box-shadow .12s ease, filter .2s;
    white-space:nowrap;
  }

  .btn:active{
    transform:translateY(3px);
    box-shadow:0 1px 0 #D98E00, 0 4px 10px rgba(245,166,35,.2);
  }

  .btn.ghost{
    background:#FFFDF5;
    border:2px solid var(--line);
    box-shadow:none;
    color:var(--brown-soft);
    font-weight:600;
    padding:12px 18px;
  }

  .btn.ghost:active{ transform:scale(.97); }

  .btn.small{
    padding:10px 16px;
    font-size:13px;
    border-radius:12px;
  }

  .row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:14px;
    align-items:center;
  }

  /* ---------- 回应卡片 ---------- */
  .response-card{
    margin-top:16px;
    background:#FFFDF5;
    border:2px solid rgba(245,180,30,.4);
    border-radius:20px;
    padding:18px 16px;
    animation:pop .3s cubic-bezier(.34,1.4,.64,1);
  }

  @keyframes pop{
    from{ opacity:0; transform:scale(.96); }
    to  { opacity:1; transform:none; }
  }

  .response-source{
    font-size:12px;
    font-weight:700;
    color:#B8860B;
    letter-spacing:.5px;
    margin-bottom:6px;
  }

  .response-quote{
    font-size:15px;
    line-height:1.8;
    color:#4E3D2E;
    font-style:italic;
    margin:0 0 12px;
    padding-left:12px;
    border-left:3px solid var(--cheese);
  }

  .response-insight{
    font-size:14px;
    line-height:1.8;
    color:#6B5A48;
    margin:0 0 12px;
  }

  .response-question{
    font-size:14px;
    line-height:1.8;
    color:#8A6D3B;
    background:#FFF9E8;
    padding:12px 14px;
    border-radius:14px;
    margin:0;
  }

  .response-question strong{
    color:#B8860B;
  }

  /* ---------- 自我对话 ---------- */
  .self-item{
    background:#fff;
    border:2px solid var(--line);
    border-radius:18px;
    margin-bottom:12px;
    overflow:hidden;
    transition:border-color .2s;
  }

  .self-item.open{ border-color:rgba(245,180,30,.5); }

  .self-q{
    padding:16px 18px;
    font-size:14.5px;
    line-height:1.7;
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    user-select:none;
  }

  .self-q .arrow{
    transition:transform .25s;
    font-size:12px;
    color:#C0AF94;
    flex-shrink:0;
  }

  .self-item.open .arrow{ transform:rotate(180deg); }

  .self-answer{
    max-height:0;
    overflow:hidden;
    transition:max-height .35s ease;
    background:#FFFDF5;
  }

  .self-item.open .self-answer{ max-height:400px; }

  .self-answer-inner{
    padding:0 16px 16px;
  }

  .self-answer textarea{
    min-height:80px;
    font-size:15px;
  }

  /* ---------- 哲学卡片 ---------- */
  .philo-card{
    background:linear-gradient(135deg,#FFFDF5,#FFF6DD);
    border:2px solid rgba(245,180,30,.4);
    border-radius:24px;
    padding:26px 22px;
    text-align:center;
    min-height:260px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    animation:pop .3s ease;
  }

  .philo-title{
    font-size:18px;
    font-weight:800;
    color:#B8860B;
    margin:0 0 14px;
  }

  .philo-content{
    font-size:15px;
    line-height:1.9;
    color:#4E3D2E;
    margin:0 0 18px;
  }

  .philo-practice{
    font-size:13.5px;
    line-height:1.8;
    color:#8A6D3B;
    background:#fff;
    padding:12px 16px;
    border-radius:14px;
    margin:0;
  }

  /* ---------- 记录列表 ---------- */
  .log-item{
    background:#fff;
    border:2px solid var(--line);
    border-radius:18px;
    padding:16px 18px;
    margin-bottom:14px;
    position:relative;
    animation:pop .3s ease;
  }

  .log-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    margin-bottom:8px;
  }

  .log-date{
    font-size:12px;
    color:#B39A6E;
  }

  .log-del{
    border:none;
    background:#F7F1E4;
    color:#A08E76;
    width:26px; height:26px;
    border-radius:50%;
    font-size:12px;
    cursor:pointer;
    display:grid;
    place-items:center;
    flex-shrink:0;
  }

  .log-del:active{ transform:scale(.9); }

  .log-text{
    font-size:14.5px;
    line-height:1.75;
    color:#4E3D2E;
    margin:0 0 10px;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
  }

  .log-resp{
    font-size:13px;
    line-height:1.7;
    color:#8A6D3B;
    background:#FFF9E8;
    padding:10px 12px;
    border-radius:12px;
    margin:0 0 8px;
  }

  .log-reflect{
    font-size:13.5px;
    line-height:1.7;
    color:#5B7A5B;
    background:#F2F8F2;
    padding:10px 12px;
    border-radius:12px;
    margin:0;
  }

  .empty-hint{
    text-align:center;
    padding:40px 16px;
    color:#B39A6E;
    font-size:14px;
    line-height:1.8;
  }

  .empty-hint .big{ font-size:40px; display:block; margin-bottom:10px; }

  /* ---------- 底部导航 ---------- */
  .bottom-nav{
    position:fixed;
    left:0; right:0; bottom:0;
    background:rgba(255,249,232,.94);
    -webkit-backdrop-filter:blur(16px);
    backdrop-filter:blur(16px);
    border-top:1px solid var(--line);
    box-shadow:0 -6px 22px rgba(190,150,70,.1);
    z-index:80;
    padding:6px 8px calc(6px + var(--safe-b));
    display:flex;
    justify-content:space-around;
    max-width:720px;
    margin:0 auto;
  }

  .nav-btn{
    flex:1;
    border:none;
    background:none;
    padding:8px 4px 6px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    font-size:11px;
    color:#B39A6E;
    cursor:pointer;
    border-radius:14px;
    transition:background .2s, color .2s;
    min-width:0;
  }

  .nav-btn .nav-emoji{ font-size:20px; line-height:1; }

  .nav-btn.active{
    color:#B8860B;
    background:rgba(255,199,44,.18);
    font-weight:700;
  }

  .nav-btn:active{ background:rgba(255,199,44,.25); }

  /* ---------- 锁 ---------- */
  .lock-overlay{
    position:fixed;
    inset:0;
    z-index:200;
    display:grid;
    place-items:center;
    padding:24px;
    background:rgba(255,249,232,.88);
    -webkit-backdrop-filter:blur(20px);
    backdrop-filter:blur(20px);
    overflow-y:auto;
  }

  .lock-overlay[hidden]{ display:none; }

  .lock-card{
    width:100%;
    max-width:380px;
    margin:auto;
    background:#fff;
    border:2px solid rgba(245,180,30,.4);
    border-radius:26px;
    padding:30px 24px 22px;
    box-shadow:0 22px 54px rgba(180,130,40,.22);
    text-align:center;
    animation:pop .32s cubic-bezier(.34,1.4,.64,1);
  }

  .lock-badge{
    width:62px; height:62px;
    margin:0 auto 14px;
    border-radius:20px;
    display:grid;
    place-items:center;
    font-size:30px;
    background:linear-gradient(135deg,#FFE9A8,#FFC72C);
    box-shadow:inset 0 -3px 0 rgba(0,0,0,.06), 0 8px 20px rgba(245,166,35,.22);
  }

  .lock-card h2{
    margin:0 0 8px;
    font-size:19px;
    font-weight:800;
    color:var(--brown);
  }

  .lock-sub{
    margin:0 0 18px;
    font-size:13.5px;
    line-height:1.7;
    color:var(--brown-soft);
  }

  .lock-input{
    width:100%;
    border:2px solid var(--line);
    border-radius:14px;
    background:#FFFDF5;
    padding:13px 15px;
    font-size:16px;
    color:var(--brown);
    outline:none;
    transition:border-color .2s, box-shadow .2s;
    margin-bottom:12px;
  }

  .lock-input:focus{
    border-color:var(--cheese);
    background:#fff;
    box-shadow:0 0 0 4px rgba(255,199,44,.16);
  }

  .lock-error{
    font-size:13px;
    color:#C24A3A;
    background:#FFF4F1;
    border-radius:12px;
    padding:9px 12px;
    text-align:left;
    margin-bottom:12px;
    line-height:1.5;
  }

  .lock-btn{
    width:100%;
    border:none;
    border-radius:14px;
    padding:15px;
    font-size:16px;
    font-weight:700;
    color:#5B4636;
    background:linear-gradient(135deg,#FFD447,#F5A623);
    cursor:pointer;
    box-shadow:0 5px 0 #D98E00, 0 10px 22px rgba(245,166,35,.28);
    transition:transform .12s ease, box-shadow .12s ease;
  }

  .lock-btn:active{
    transform:translateY(3px);
    box-shadow:0 1px 0 #D98E00, 0 4px 10px rgba(245,166,35,.2);
  }

  .lock-hint{
    margin:14px 0 0;
    font-size:12px;
    line-height:1.6;
    color:#C0AF94;
  }

  .lock-link{
    background:none;
    border:none;
    color:#B39A6E;
    font-size:13px;
    padding:10px 6px 2px;
    cursor:pointer;
    text-decoration:underline;
    text-underline-offset:3px;
    text-decoration-color:rgba(179,154,110,.4);
  }

  /* ---------- toast ---------- */
  .toast{
    position:fixed;
    left:50%;
    bottom:calc(96px + var(--safe-b));
    transform:translate(-50%, 14px);
    background:#5B4636;
    color:#FFF6DE;
    padding:11px 22px;
    border-radius:999px;
    font-size:13.5px;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    box-shadow:0 10px 26px rgba(91,70,54,.3);
    z-index:300;
    max-width:86vw;
    text-align:center;
  }

  .toast.show{
    opacity:1;
    transform:translate(-50%, 0);
  }

  .sr-only{
    position:absolute;
    width:1px; height:1px;
    padding:0; margin:-1px;
    overflow:hidden;
    clip:rect(0,0,0,0);
    white-space:nowrap;
    border:0;
  }

  @media (max-width:480px){
    .app-wrap{ padding:0 12px 82px; }
    .hero{ padding:34px 6px 16px; }
    .hero .float{ display:none; }
    .card{ padding:18px 15px; border-radius:20px; }
    .philo-card{ padding:22px 16px; }
    .bottom-nav{ padding:4px 4px calc(4px + var(--safe-b)); }
    .nav-btn{ font-size:10px; }
    .nav-btn .nav-emoji{ font-size:18px; }
  }
</style>
</head>
<body class="locked">

<!-- ========== 锁屏 ========== -->
<div class="lock-overlay" id="lockOverlay">
  <div class="lock-card" id="lockCard">
    <div class="lock-badge" id="lockBadge">🧀</div>
    <h2 id="lockTitle">Inner Cheese</h2>
    <p class="lock-sub" id="lockSub">加载中…</p>
    <div id="lockBody"></div>
  </div>
</div>

<!-- ========== 主应用 ========== -->
<div class="app-wrap" id="app" hidden>

  <header class="hero">
    <span class="float f1">🧀</span>
    <span class="float f2">🪶</span>
    <h1>Inner Cheese</h1>
    <p class="tagline">在芝士的香气里，和自己聊聊哲学</p>
  </header>

  <main>
    <!-- 倾诉 -->
    <section class="view active" id="view-vent">
      <div class="card">
        <h2 class="card-title"><span class="emoji">💬</span> 发生了什么？</h2>
        <textarea id="ventInput" placeholder="把心里的内耗写下来吧，尤其是关于友情的……"></textarea>
        <div class="row">
          <button class="btn" id="ventBtn" type="button">得到回应 🧀</button>
          <button class="btn ghost small" id="ventClear" type="button">清空</button>
        </div>
      </div>

      <div id="responseArea"></div>

      <div class="card" id="reflectCard" hidden>
        <h2 class="card-title"><span class="emoji">🪞</span> 我的反思</h2>
        <textarea id="reflectInput" placeholder="看了回应之后，你想对自己说点什么？"></textarea>
        <div class="row">
          <button class="btn" id="saveVentBtn" type="button">保存这一刻</button>
        </div>
      </div>
    </section>

    <!-- 自我对话 -->
    <section class="view" id="view-self">
      <div class="card">
        <h2 class="card-title"><span class="emoji">🧭</span> 自我认识练习</h2>
        <p style="font-size:13.5px;line-height:1.8;color:#8A7361;margin:0 0 6px;">
          点开每个问题，慢慢写。答案只存在你自己的手机里。
        </p>
      </div>
      <div id="selfList"></div>
    </section>

    <!-- 哲学卡片 -->
    <section class="view" id="view-philo">
      <div id="philoCardWrap"></div>
      <div class="row" style="justify-content:center;">
        <button class="btn" id="newPhiloBtn" type="button">换一张 🎴</button>
      </div>
    </section>

    <!-- 记录 -->
    <section class="view" id="view-log">
      <div class="card">
        <h2 class="card-title"><span class="emoji">📜</span> 我的倾诉记录</h2>
        <div id="logList"></div>
      </div>
    </section>
  </main>

  <footer style="text-align:center;font-size:12px;color:#C0AF94;padding:30px 0 10px;">
    cheeserain
  </footer>
</div>

<!-- ========== 底部导航 ========== -->
<nav class="bottom-nav" id="bottomNav" hidden>
  <button class="nav-btn active" data-view="vent">
    <span class="nav-emoji">💬</span> 倾诉
  </button>
  <button class="nav-btn" data-view="self">
    <span class="nav-emoji">🧭</span> 认识自己
  </button>
  <button class="nav-btn" data-view="philo">
    <span class="nav-emoji">📖</span> 哲学卡片
  </button>
  <button class="nav-btn" data-view="log">
    <span class="nav-emoji">📜</span> 记录
  </button>
</nav>

<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';

  /* ============================================================
     一、数据
     ============================================================ */

  // 回应库
  const RESPONSES = [
    {
      tags: ['朋友','友情','付出','不对等','内耗'],
      source: '亚里士多德',
      quote: '友爱分三种：功利的、快乐的、德性的。只有德性的友爱才持久而高尚。',
      insight: '如果你在友情中感到内耗，也许可以想想：这段关系建立在什么之上？是彼此需要，还是彼此欣赏？',
      question: '这段友谊满足的是我的哪种需求？我能为它做点什么？'
    },
    {
      tags: ['讨好','被讨厌','害怕','拒绝','委屈'],
      source: '爱比克泰德',
      quote: '不要为了取悦他人而活，也不要为了他人的看法而焦虑。',
      insight: '你无法控制别人怎么看你，但你可以控制自己是否真诚。讨好换来的喜欢，往往不是真正的联结。',
      question: '如果我不再讨好，最坏的结果是什么？我能承受吗？'
    },
    {
      tags: ['疏远','失去','变化','冷漠'],
      source: '赫拉克利特',
      quote: '万物皆流，无物常驻。',
      insight: '友谊也会流动。有人走进你的生命，有人离开。这不代表你不够好，只是彼此的河流拐向了不同的方向。',
      question: '我是否把“关系永远不变”当成了理所当然？'
    },
    {
      tags: ['嫉妒','比较','羡慕'],
      source: '尼采',
      quote: '嫉妒是灵魂的溃疡，但也可以成为向上的动力。',
      insight: '当你嫉妒朋友时，也许是因为你看到了自己渴望却尚未拥有的东西。与其内耗，不如把它变成温柔的提醒。',
      question: '我嫉妒的到底是什么？我能不能为自己也争取一点？'
    },
    {
      tags: ['误解','被误会','解释','委屈'],
      source: '庄子',
      quote: '夏虫不可以语于冰者，笃于时也。',
      insight: '不是所有人都能理解你。有些误解不必强行澄清，因为对方可能受限于自己的经历和视角。',
      question: '我是否在试图让所有人都理解我？这真的可能吗？'
    },
    {
      tags: ['孤独','一个人','没人懂'],
      source: '塞内加',
      quote: '独自一人时，你并非孤独；只有在人群中感到不被理解，才是真正的孤独。',
      insight: '孤独感常常来自“不被看见”。但你可以先成为那个看见自己的人。',
      question: '我能不能先对自己温柔一点，像对待最好的朋友那样？'
    },
    {
      tags: ['内耗','焦虑','想太多','纠结'],
      source: '马可·奥勒留',
      quote: '你拥有控制自己心灵的力量，而非外部事件。意识到这一点，你就会找到力量。',
      insight: '内耗往往是把精力花在了无法控制的事情上。回到你能控制的部分，哪怕只是呼吸。',
      question: '这件事里，我能控制的是什么？不能控制的是什么？'
    },
    {
      tags: ['边界','拒绝','说不','底线'],
      source: '孔子',
      quote: '益者三友，损者三友。友直，友谅，友多闻，益矣。',
      insight: '好的友谊让你舒展，而不是消耗。设立边界不是自私，而是保护你内心花园的篱笆。',
      question: '如果我设立边界，我害怕失去什么？这份害怕合理吗？'
    },
    {
      tags: ['自我价值','不配','自卑','否定'],
      source: '康德',
      quote: '人是目的，不是手段。',
      insight: '你不需要通过讨好别人来证明自己值得被爱。你的存在本身就有价值。',
      question: '我是否把朋友的评价当成了衡量自己的唯一尺子？'
    },
    {
      tags: ['比较','朋友成功','落差'],
      source: '蒙田',
      quote: '友谊是灵魂的共鸣，而不是地位的比较。',
      insight: '真正的朋友会为你的成长高兴，你也会为他的成就祝福。如果比较让你痛苦，也许需要重新看看这段关系。',
      question: '我希望朋友好，但为什么我会难受？这份难受想告诉我什么？'
    },
    {
      tags: ['付出','不被珍惜','失望'],
      source: '爱比克泰德',
      quote: '不要要求事情按你的意愿发生，而要希望事情如其所是。',
      insight: '你可以选择付出，但无法要求回报。如果付出让你委屈，也许该调整的是自己的期待。',
      question: '我付出时，是真的心甘情愿，还是暗中期盼回报？'
    },
    {
      tags: ['原谅','放下','怨恨'],
      source: '马可·奥勒留',
      quote: '最好的报复是不成为像对方那样的人。',
      insight: '怨恨就像自己喝下毒药，却希望对方痛苦。原谅不是为了对方，而是为了把自己从内耗中释放出来。',
      question: '我愿不愿意为了自己的平静，试着松开一点？'
    }
  ];

  // 自我认识问题
  const SELF_QUESTIONS = [
    { id:'q1', text:'在这件事里，我能控制的是什么？不能控制的是什么？' },
    { id:'q2', text:'我是否把朋友的看法当成了自我价值的唯一标准？' },
    { id:'q3', text:'如果我最好的朋友这样对我，我会怎么建议他？' },
    { id:'q4', text:'这段友谊满足的是我的哪种需求？功利、快乐还是德性？' },
    { id:'q5', text:'我在害怕失去什么？这个害怕是真实的还是想象的？' },
    { id:'q6', text:'如果我不再讨好，最坏的结果是什么？我能承受吗？' },
    { id:'q7', text:'我有没有把朋友当成独立的“他者”来尊重他的自由？' },
    { id:'q8', text:'我是不是在用自己的标准要求别人？' },
    { id:'q9', text:'这件事一年后还重要吗？' },
    { id:'q10', text:'我能否像对待自己一样对待朋友，也像对待朋友一样对待自己？' }
  ];

  // 哲学卡片
  const PHILO_CARDS = [
    { title:'斯多葛控制二分法', content:'爱比克泰德说：有些事取决于我们，有些事不取决于我们。取决于我们的是判断、欲望、厌恶；不取决于我们的是身体、财产、名声、他人的看法。', practice:'今天遇到烦心事时，问自己：这件事中，我能控制的是什么？' },
    { title:'亚里士多德的友爱论', content:'友爱分三种：功利的、快乐的、德性的。只有德性的友爱，是因对方本身而爱他，才持久而高尚。', practice:'想想你最重要的一段友谊，它更接近哪一种？' },
    { title:'萨特：他人即地狱？', content:'萨特说“他人即地狱”，并不是说别人都很坏，而是说我们常常通过别人的目光来定义自己，从而失去自由。', practice:'今天试着做一件不为了给别人看的小事。' },
    { title:'庄子的无用之用', content:'一棵不成材的树，因为“无用”而免于被砍伐，得以长寿。有时候，你的“缺点”恰恰保护了你。', practice:'列出你一个“没用”的特点，想想它可能带给你什么。' },
    { title:'尼采：成为你自己', content:'“你要成为你自己。”这不是自私，而是说，你的人生剧本不该由别人来写。', practice:'今天做一个小决定，完全按自己的心意来。' },
    { title:'马可·奥勒留的清晨', content:'清晨对自己说：今天我将遇见爱管闲事的人、忘恩负义的人、傲慢的人……他们如此，是因为不能分辨善恶。', practice:'今天遇到难缠的人时，在心里默念：他也有他的局限。' },
    { title:'塞内加的愤怒论', content:'愤怒是短暂的疯狂。伤害你的往往不是事情本身，而是你对事情的看法。', practice:'下次生气时，先深呼吸三次，再决定要不要发火。' },
    { title:'孔子：己所不欲，勿施于人', content:'这是人际关系的黄金法则：你不想被怎样对待，就不要那样对待别人。', practice:'今天对朋友做一件你希望被对待的小事。' },
    { title:'赫拉克利特的河流', content:'人不能两次踏进同一条河流。一切都在变化，包括你和你的友谊。', practice:'接受一个已经变化的关系，哪怕只是在心里承认。' },
    { title:'蒙田的友谊', content:'“因为他是他，因为我是我。”真正的友谊不需要理由，是灵魂的相遇。', practice:'给一位老朋友发一条简单的问候。' },
    { title:'爱比克泰德：关于失去', content:'不要说你失去了什么，而要说你把它还回去了。', practice:'想想一件你失去的东西，试着换个角度看待。' },
    { title:'苏格拉底：认识你自己', content:'“未经审视的人生不值得过。”认识自己，是一切智慧的起点。', practice:'今天花五分钟，问问自己：我现在真正需要的是什么？' }
  ];

  /* ============================================================
     二、存储键
     ============================================================ */
  const K_LOCK = 'inner-cheese-lock';
  const K_ENTRIES = 'inner-cheese-entries';
  const K_SELF = 'inner-cheese-self';
  const K_PHILO_IDX = 'inner-cheese-philo-idx';

  /* ============================================================
     三、工具
     ============================================================ */
  function $(id){ return document.getElementById(id); }
  function escapeHTML(str){
    return String(str)
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;')
      .replace(/'/g,'&#39;');
  }
  function now(){ return Date.now(); }
  function formatDate(ts){
    const d = new Date(ts);
    const pad = n => String(n).padStart(2,'0');
    return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  let toastTimer = null;
  function toast(msg){
    const el = $('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
  }

  /* 简单哈希（本地防君子） */
  function simpleHash(str){
    let h1 = 0x811c9dc5, h2 = 0x1000193;
    for (let i=0;i<str.length;i++){
      const c = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ c, 16777619) >>> 0;
      h2 = Math.imul(h2 + c*(i+1), 2246822519) >>> 0;
    }
    return 'h' + h1.toString(16).padStart(8,'0') + h2.toString(16).padStart(8,'0');
  }
  function makeSalt(){
    return Math.random().toString(36).slice(2,10) + Math.random().toString(36).slice(2,10);
  }

  /* ============================================================
     四、密码锁
     ============================================================ */
  let lockData = null;
  try {
    const raw = localStorage.getItem(K_LOCK);
    if (raw) lockData = JSON.parse(raw);
  } catch(e){}

  const lockOverlay = $('lockOverlay');
  const lockBadge = $('lockBadge');
  const lockTitle = $('lockTitle');
  const lockSub = $('lockSub');
  const lockBody = $('lockBody');
  const lockCard = $('lockCard');
  const appEl = $('app');
  const bottomNav = $('bottomNav');

  function showLockError(msg){
    const el = lockBody.querySelector('.lock-error');
    if (el){ el.textContent = msg; el.hidden = false; }
    lockCard.classList.remove('shake');
    void lockCard.offsetWidth;
    lockCard.classList.add('shake');
    lockBody.querySelectorAll('input').forEach(i => i.value = '');
    const first = lockBody.querySelector('input');
    if (first) first.focus();
  }

  function renderLock(){
    lockBody.innerHTML = '';
    if (!lockData){
      // 设置密码
      lockBadge.textContent = '🔒';
      lockTitle.textContent = '给芝士花园加把锁';
      lockSub.textContent = '设置一个密码，只有你能打开这里';
      const form = document.createElement('form');
      form.innerHTML =
        '<input class="lock-input" type="password" name="pwd" placeholder="设置密码（至少4位）" autocomplete="off">' +
        '<input class="lock-input" type="password" name="confirm" placeholder="再输入一次" autocomplete="off">' +
        '<p class="lock-error" hidden></p>' +
        '<button class="lock-btn" type="submit">启用密码 🔒</button>' +
        '<button class="lock-link" type="button" id="skipLockBtn">暂不设置，先随便看看</button>';
      lockBody.appendChild(form);
      form.addEventListener('submit', e => {
        e.preventDefault();
        const pwd = form.querySelector('[name="pwd"]').value;
        const confirm = form.querySelector('[name="confirm"]').value;
        if (pwd.length < 4) return showLockError('密码至少 4 位哦');
        if (pwd !== confirm) return showLockError('两次输入的密码不一样');
        const salt = makeSalt();
        lockData = { salt, hash: simpleHash(salt + '::' + pwd) };
        localStorage.setItem(K_LOCK, JSON.stringify(lockData));
        unlockApp();
      });
      const skip = form.querySelector('#skipLockBtn');
      skip.addEventListener('click', () => {
        lockData = null;
        localStorage.removeItem(K_LOCK);
        unlockApp();
      });
    } else {
      // 解锁
      lockBadge.textContent = '🧀';
      lockTitle.textContent = '芝士花园锁着';
      lockSub.textContent = '输入密码，打开你的内心角落';
      const form = document.createElement('form');
      form.innerHTML =
        '<input class="lock-input" type="password" name="pwd" placeholder="输入密码" autocomplete="off">' +
        '<p class="lock-error" hidden></p>' +
        '<button class="lock-btn" type="submit">打开 🧀</button>' +
        '<p class="lock-hint">忘记密码？只能清除浏览器数据，记录也会一起消失哦。</p>';
      lockBody.appendChild(form);
      form.addEventListener('submit', e => {
        e.preventDefault();
        const pwd = form.querySelector('[name="pwd"]').value;
        if (!pwd) return showLockError('请输入密码');
        const hash = simpleHash(lockData.salt + '::' + pwd);
        if (hash !== lockData.hash) return showLockError('密码不对，再想想～');
        unlockApp();
      });
    }
    requestAnimationFrame(() => {
      const first = lockBody.querySelector('input');
      if (first) first.focus();
    });
  }

  function unlockApp(){
    lockOverlay.hidden = true;
    document.body.classList.remove('locked');
    appEl.hidden = false;
    bottomNav.hidden = false;
    initApp();
  }

  /* ============================================================
     五、应用数据
     ============================================================ */
  let entries = [];
  let selfAnswers = {};
  let philoIdx = 0;

  function loadData(){
    try {
      const e = localStorage.getItem(K_ENTRIES);
      if (e) entries = JSON.parse(e);
    } catch(err){ entries = []; }
    try {
      const s = localStorage.getItem(K_SELF);
      if (s) selfAnswers = JSON.parse(s);
    } catch(err){ selfAnswers = {}; }
    try {
      const p = localStorage.getItem(K_PHILO_IDX);
      if (p !== null) philoIdx = parseInt(p,10) || 0;
    } catch(err){ philoIdx = 0; }
  }

  function saveEntries(){
    localStorage.setItem(K_ENTRIES, JSON.stringify(entries));
  }
  function saveSelf(){
    localStorage.setItem(K_SELF, JSON.stringify(selfAnswers));
  }
  function savePhiloIdx(){
    localStorage.setItem(K_PHILO_IDX, String(philoIdx));
  }

  /* ============================================================
     六、渲染
     ============================================================ */

  // 当前视图
  let currentView = 'vent';

  function switchView(view){
    currentView = view;
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    const el = $('view-' + view);
    if (el) el.classList.add('active');
    document.querySelectorAll('.nav-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.view === view);
    });
    if (view === 'log') renderLog();
    if (view === 'self') renderSelf();
    if (view === 'philo') renderPhilo();
    window.scrollTo({ top:0, behavior:'smooth' });
  }

  // ---- 倾诉 ----
  let currentResponse = null;
  let usedResponseIndices = new Set();

  function pickResponse(userText){
    const text = userText.toLowerCase();
    let best = null;
    let bestScore = 0;
    let candidates = [];

    RESPONSES.forEach((r, idx) => {
      let score = 0;
      r.tags.forEach(tag => {
        if (text.includes(tag.toLowerCase())) score++;
      });
      if (score > bestScore){
        bestScore = score;
        best = r;
        candidates = [idx];
      } else if (score === bestScore && score > 0){
        candidates.push(idx);
      }
    });

    if (bestScore > 0 && candidates.length > 0){
      // 随机选一个同分且尽量没用的
      const fresh = candidates.filter(i => !usedResponseIndices.has(i));
      const pool = fresh.length ? fresh : candidates;
      const idx = pool[Math.floor(Math.random() * pool.length)];
      usedResponseIndices.add(idx);
      if (usedResponseIndices.size >= RESPONSES.length) usedResponseIndices.clear();
      return RESPONSES[idx];
    }

    // 没有匹配，随机选未用的
    const all = RESPONSES.map((_, i) => i);
    const unused = all.filter(i => !usedResponseIndices.has(i));
    const pool = unused.length ? unused : all;
    const idx = pool[Math.floor(Math.random() * pool.length)];
    usedResponseIndices.add(idx);
    if (usedResponseIndices.size >= RESPONSES.length) usedResponseIndices.clear();
    return RESPONSES[idx];
  }

  function renderResponse(resp){
    const area = $('responseArea');
    if (!resp){
      area.innerHTML = '';
      $('reflectCard').hidden = true;
      return;
    }
    currentResponse = resp;
    area.innerHTML =
      '<div class="response-card">' +
        '<div class="response-source">🧠 ' + escapeHTML(resp.source) + '</div>' +
        '<p class="response-quote">“' + escapeHTML(resp.quote) + '”</p>' +
        '<p class="response-insight">' + escapeHTML(resp.insight) + '</p>' +
        '<p class="response-question"><strong>问问自己：</strong>' + escapeHTML(resp.question) + '</p>' +
      '</div>';
    $('reflectCard').hidden = false;
    $('reflectInput').value = '';
  }

  function saveVent(){
    const userText = $('ventInput').value.trim();
    if (!userText) return toast('先写点什么吧 🧀');
    if (!currentResponse) return toast('先点“得到回应”哦');
    const reflect = $('reflectInput').value.trim();

    entries.unshift({
      id: now().toString(36) + Math.random().toString(36).slice(2,6),
      ts: now(),
      userText,
      source: currentResponse.source,
      quote: currentResponse.quote,
      insight: currentResponse.insight,
      question: currentResponse.question,
      reflection: reflect
    });
    saveEntries();

    $('ventInput').value = '';
    $('reflectInput').value = '';
    $('responseArea').innerHTML = '';
    $('reflectCard').hidden = true;
    currentResponse = null;
    toast('已保存到芝士罐罐 🧀');
  }

  // ---- 自我对话 ----
  function renderSelf(){
    const list = $('selfList');
    list.innerHTML = SELF_QUESTIONS.map(q => {
      const ans = selfAnswers[q.id] || '';
      const open = ans ? ' open' : '';
      return '<div class="self-item' + open + '" data-id="' + q.id + '">' +
        '<div class="self-q">' +
          '<span>' + escapeHTML(q.text) + '</span>' +
          '<span class="arrow">▼</span>' +
        '</div>' +
        '<div class="self-answer">' +
          '<div class="self-answer-inner">' +
            '<textarea data-qid="' + q.id + '" placeholder="写下你的答案…">' + escapeHTML(ans) + '</textarea>' +
          '</div>' +
        '</div>' +
      '</div>';
    }).join('');

    // 事件
    list.querySelectorAll('.self-q').forEach(el => {
      el.addEventListener('click', () => {
        const item = el.closest('.self-item');
        item.classList.toggle('open');
      });
    });

    list.querySelectorAll('textarea[data-qid]').forEach(ta => {
      ta.addEventListener('input', () => {
        const qid = ta.dataset.qid;
        selfAnswers[qid] = ta.value;
        saveSelf();
      });
    });
  }

  // ---- 哲学卡片 ----
  function renderPhilo(){
    const card = PHILO_CARDS[philoIdx % PHILO_CARDS.length];
    $('philoCardWrap').innerHTML =
      '<div class="philo-card">' +
        '<div class="philo-title">📖 ' + escapeHTML(card.title) + '</div>' +
        '<p class="philo-content">' + escapeHTML(card.content) + '</p>' +
        '<p class="philo-practice"><strong>小练习：</strong>' + escapeHTML(card.practice) + '</p>' +
      '</div>';
  }

  // ---- 记录 ----
  function renderLog(){
    const list = $('logList');
    if (!entries.length){
      list.innerHTML = '<div class="empty-hint"><span class="big">🧀</span>还没有记录<br>去倾诉里写下第一块芝士吧</div>';
      return;
    }
    list.innerHTML = entries.map(e => {
      return '<div class="log-item" data-id="' + e.id + '">' +
        '<div class="log-head">' +
          '<span class="log-date">' + formatDate(e.ts) + '</span>' +
          '<button class="log-del" data-id="' + e.id + '" title="删除">✕</button>' +
        '</div>' +
        '<p class="log-text">' + escapeHTML(e.userText) + '</p>' +
        '<div class="log-resp">🧠 ' + escapeHTML(e.source) + '：“' + escapeHTML(e.quote) + '”</div>' +
        (e.reflection ? '<div class="log-reflect">🪞 ' + escapeHTML(e.reflection) + '</div>' : '') +
      '</div>';
    }).join('');

    list.querySelectorAll('.log-del').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.id;
        if (!confirm('删除这条记录吗？')) return;
        entries = entries.filter(x => x.id !== id);
        saveEntries();
        renderLog();
        toast('已删除');
      });
    });
  }

  /* ============================================================
     七、事件绑定与初始化
     ============================================================ */
  function initApp(){
    loadData();
    renderSelf();
    renderPhilo();

    // 导航
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => switchView(btn.dataset.view));
    });

    // 倾诉
    $('ventBtn').addEventListener('click', () => {
      const txt = $('ventInput').value.trim();
      if (!txt) return toast('先写下发生了什么吧');
      const resp = pickResponse(txt);
      renderResponse(resp);
    });
    $('ventClear').addEventListener('click', () => {
      $('ventInput').value = '';
      $('responseArea').innerHTML = '';
      $('reflectCard').hidden = true;
      currentResponse = null;
    });
    $('saveVentBtn').addEventListener('click', saveVent);

    // 哲学卡片
    $('newPhiloBtn').addEventListener('click', () => {
      philoIdx = (philoIdx + 1) % PHILO_CARDS.length;
      savePhiloIdx();
      renderPhilo();
    });

    // 默认视图
    switchView('vent');
  }

  /* 启动：检查锁 */
  renderLock();
  if (lockData) {
    // 需要解锁
  } else {
    // 没密码，显示设置界面
  }

})();
</script>
